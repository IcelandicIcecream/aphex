name: Release

on:
  push:
    branches:
      - main
  # A snapshot of any branch, published under a dist-tag (`next` by default) so
  # `latest` never moves: `pnpm create aphex@next`, `pnpm add @aphexcms/cms-core@next`.
  # It lives in this file rather than its own because npm's trusted publishing is
  # configured per workflow file, for every package.
  workflow_dispatch:
    inputs:
      tag:
        description: 'npm dist-tag and prerelease name, e.g. next -> 12.0.0-next.20261109080555'
        type: string
        default: next

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Version & Publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    outputs:
      # 'true' only when this run actually published to npm. A run that merely opens
      # the "version packages" PR also succeeds, so downstream jobs must check this
      # rather than the run's conclusion.
      published: ${{ steps.changesets.outputs.published }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # npm's OIDC trusted publishing (which is what lets this workflow publish
      # with no NPM_TOKEN, using the `id-token: write` permission above) landed in
      # npm 11.5.1. `setup-node` installs whatever npm ships with the Node
      # version, so without this the publish step's auth silently depends on a
      # transitive choice — and the failure mode is a 404/E401 at publish time,
      # after versions are already committed and tagged.
      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fail before publishing rather than after. `changeset publish` pushes each
      # package in turn, so a packaging fault found on package 7 of 15 leaves a
      # half-published release that can only be resolved by shipping another
      # version — npm does not allow republishing one.
      - name: Verify packed packages
        run: node scripts/verify-packed-packages.mjs

      # `version-packages` is `changeset version && pnpm install --lockfile-only`. The
      # second half is not optional: when a package majors, changesets rewrites the peer
      # ranges of everything depending on it (cms-core 10 -> 11 rewrote plugin-forms'
      # `workspace:>=9` to `workspace:>=11.0.0`) but never touches the lockfile. The
      # version PR then carries manifests and a lockfile that disagree, and every job on
      # it dies at `pnpm install --frozen-lockfile` before running a single test.
      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Pending changesets give each package its next version (cms-core 12.0.0), plus
  # `-<tag>.<datetime>`. Nothing is committed or tagged: the changesets stay pending
  # for the real release, and `latest` stays where it is.
  snapshot:
    name: Publish snapshot
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check the tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          # `latest` would replace the stable release for everyone; the prerelease
          # name is also what create-aphex reads back to pick the tag it installs from.
          if [ "$TAG" = latest ] || ! printf '%s' "$TAG" | grep -Eq '^[a-z]+$'; then
            echo "::error::The tag must be lowercase letters and not 'latest' (got '$TAG')."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # changelog-github looks up each changeset's PR, which needs the token.
      - name: Version as a snapshot
        run: pnpm changeset version --snapshot "$TAG"
        env:
          TAG: ${{ inputs.tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify packed packages
        run: node scripts/verify-packed-packages.mjs

      - name: Build
        run: pnpm turbo build --filter='./packages/*' --filter='./plugins/*'

      - name: Publish
        run: pnpm changeset publish --tag "$TAG" --no-git-tag --provenance
        env:
          TAG: ${{ inputs.tag }}

  # Mirror the templates to their standalone repos — but only once the versions they
  # pin are actually on npm.
  sync-templates:
    name: Sync templates
    needs: release
    if: needs.release.outputs.published == 'true'
    uses: ./.github/workflows/sync-template.yml
    secrets: inherit
